# Include inside the existing HTTPS server{} or the location{} serving server/.
# Keep your existing TLS certificate, server_name and document-root settings.
# Serve .js as application/javascript or text/javascript and .json as application/json
# using your existing mime.types. Missing files must return 404, not index.html.
add_header Access-Control-Allow-Origin "*" always;
add_header Cache-Control "no-cache" always;
add_header X-Content-Type-Options "nosniff" always;
